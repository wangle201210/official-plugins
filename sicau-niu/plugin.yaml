# Plugin identifier, unique across the host and source plugin directories; use `kebab-case`.
# 插件唯一标识，必须在宿主和源码插件目录中保持唯一，并使用 `kebab-case` 命名风格。
id: sicau-niu

# Plugin display name used in plugin management pages, developer docs, and presentation.
# 插件显示名称，用于插件管理页面、开发文档和展示。
name: 寻牛活动

# Plugin semantic version; examples in this repo use the `v` prefix.
# 插件语义化版本号，当前示例统一使用带 `v` 前缀的写法。
version: v0.2.0

# Plugin type enum. Allowed values: `source` is compiled with the host; `dynamic` is loaded as a runtime plugin artifact.
# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# Multi-tenant scope enum. Allowed values: `platform_only` is platform-context only; `tenant_aware` is governed by tenant context.
# 多租户作用域枚举。本活动不涉及多租户，固定平台上下文。
scope_nature: platform_only

# Multi-tenant support flag. `false` means the plugin does not participate in tenant-level governance.
# 多租户支持标记。`false` 表示插件不参与租户级治理。
supports_multi_tenant: false

# Default install mode enum. `global` enables one shared installation.
# 默认安装模式枚举。`global` 表示全局统一安装启用。
default_install_mode: global

# Plugin description summarizing the capability boundary.
# 插件说明，概述插件的能力边界。
description: 川农 120 周年寻牛活动插件。C1 提供玩家登录/身份、院系字典与运营查询能力。

# Plugin author or owning team.
# 插件作者或归属团队。
author: linapro

# Plugin homepage or documentation URL for extra project, design, or external references.
# 插件主页或文档地址。
homepage: https://example.com/lina/plugins/sicau-niu

# Plugin license identifier.
# 插件许可证标识。
license: Apache-2.0

# Declared public static assets hosted by the host under /x-assets/{plugin-id}/{version}/...
# The C6 H5 digital memorial wall is delivered here as a standalone mobile page that calls the
# public (no-auth) memorial-wall API and offers a back-to-mini-program entry. It is independent of
# the management Vue pages and does not enter the management front-end build.
# 声明式公开静态资源目录，由宿主托管到 /x-assets/{plugin-id}/{version}/...。
# C6 的 H5 数字纪念墙作为独立移动端页面在此交付，调用公开免登录的纪念墙 API 并提供回跳小程序入口；
# 它独立于管理端 Vue 页面，不进入管理端前端构建。
public_assets:
  - source: frontend/wall
    mount: wall
    index: index.html

# This plugin is single-language (Chinese) and intentionally omits the optional `i18n` block,
# so the host treats it as single-language and does not require manifest/i18n resources.
# 本插件为单语言（中文），刻意省略可选的 `i18n` 配置块，宿主据此按单语言处理。
#
# Plugin menu declaration list; the host syncs menus, button permissions, and route entries from it.
