# media 源码插件运行时配置模板。
tieta:
  # 上游 Tieta OpenAPI 服务基础地址，用于基于 token 的媒体授权。
  baseUrl: "https://tieta.example.com"
  # 是否启用本地 Tieta 模拟响应，用于开发和隔离测试。
  mock: false
  # 单次上游 Tieta HTTP 请求超时时间。
  timeout: "3s"

innerapi:
  # mediaopen 内部 API 通过 X-Inner-Api-Key 请求头校验所需的 API key。
  apiKey: "media"

collectionServer:
  # 是否启用兼容 net-flux 的 TCP 数据采集服务。
  enabled: false
  # 客户端上报器使用的 TCP 监听地址。
  addr: ":1911"
  discovery:
    # 是否启用基于 Nacos 的 net-flux 发现命令。
    enabled: false
    # Nacos 服务地址。
    host: "127.0.0.1"
    # Nacos 服务端口。
    port: 8848
    # Nacos 命名空间。
    namespace: "public"
    # Nacos SDK 日志目录。
    logDir: "./logs"
    # Nacos SDK 本地缓存目录。
    cacheDir: "./cache"
    # Nacos SDK 启动时是否跳过加载本地缓存。
    notLoadCacheAtStart: true
    # Nacos SDK 请求超时时间，单位为毫秒。
    timeout: 5000
    # Nacos 用户名。
    username: "nacos"
    # Nacos 密码。
    password: "nacos"
    # 发现数据包未携带节点编号时使用的默认节点 ID。
    node: 1
