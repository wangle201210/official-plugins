# Runtime configuration template for the media source plugin.
tieta:
  # Base URL of the upstream Tieta OpenAPI service used by token-based media authorization.
  baseUrl: "https://tieta.example.com"
  # Enables deterministic local Tieta responses for development and isolated tests.
  mock: false
  # Timeout for one upstream Tieta HTTP request.
  timeout: "3s"

innerapi:
  # API key required by mediaopen internal APIs through the X-Inner-Api-Key header.
  apiKey: "media"

collectionServer:
  # Enables the net-flux compatible TCP data collection server.
  enabled: false
  # TCP listen address used by client-side reporters.
  addr: ":1911"
  discovery:
    # Enables Nacos-backed net-flux discovery commands.
    enabled: false
    # Nacos server host.
    host: "127.0.0.1"
    # Nacos server port.
    port: 8848
    # Nacos namespace.
    namespace: "public"
    # Nacos SDK log directory.
    logDir: "./logs"
    # Nacos SDK local cache directory.
    cacheDir: "./cache"
    # Whether the Nacos SDK skips loading local cache at client startup.
    notLoadCacheAtStart: true
    # Nacos SDK request timeout in milliseconds.
    timeout: 5000
    # Nacos username.
    username: "nacos"
    # Nacos password.
    password: "nacos"
    # Default node ID used when discovery packets omit node.
    node: 1
