apiVersion: v1
kind: Namespace
metadata:
  name: linapro
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-external-pgsql-secret
  namespace: linapro
type: Opaque
stringData:
  PGSQL_HOST: "pgsql.example.internal"
  PGSQL_PORT: "5432"
  PGSQL_USER: "postgres"
  PGSQL_PASSWORD: "linapro-change-me"
  PGSQL_DATABASE: "linapro"
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-config
  namespace: linapro
type: Opaque
stringData:
  config.yaml: |
    server:
      address: ":9120"
      dumpRouterMap: false
      routeOverWrite: true

    logger:
      path: "stdout"
      stdout: true
      level: "info"

    database:
      default:
        link: "pgsql:postgres:linapro-change-me@tcp(pgsql.example.internal:5432)/linapro?sslmode=disable"
        debug: false
        dryRun: false

    jwt:
      secret: "linapro-jwt-change-me"
      expire: 24h

    i18n:
      default: zh-CN
      enabled: true
      locales:
        - locale: en-US
          nativeName: English
        - locale: zh-CN
          nativeName: 简体中文

    cluster:
      enabled: true
      coordination: redis
      election:
        lease: 30s
        renewInterval: 10s
      redis:
        address: "linapro-redis:6379"
        db: 0
        password: ""
        connectTimeout: 3s
        readTimeout: 2s
        writeTimeout: 2s

    upload:
      path: "/app/data/upload"

    plugin:
      autoEnable:
        - id: "media"
          withMockData: false
      dynamic:
        storagePath: "/app/data/wasm"

    workspace:
      basePath: "/admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-source-plugin-configs
  namespace: linapro
type: Opaque
stringData:
  media-config.yaml: |
    collectionServer:
      enabled: true
      addr: ":1911"
      discovery:
        enabled: true
        host: "linapro-nacos"
        port: 8848
        namespace: "public"
        logDir: "/tmp/nacos/logs"
        cacheDir: "/tmp/nacos/cache"
        preloadCache: true
        timeout: 5000
        groupName: "DEFAULT_GROUP"
        username: "nacos"
        password: "nacos"
        node: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linapro-data
  namespace: linapro
spec:
  # This PVC is mounted by three LinaPro pods and must use a StorageClass
  # that supports ReadWriteMany. If the default StorageClass does not support
  # RWX, set storageClassName to an RWX-capable class such as NFS, CephFS, or EFS.
  # storageClassName: nfs-rwx
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linapro-redis
  namespace: linapro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linapro-redis
  template:
    metadata:
      labels:
        app: linapro-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-redis
  namespace: linapro
spec:
  type: ClusterIP
  selector:
    app: linapro-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linapro-nacos-data
  namespace: linapro
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linapro-nacos
  namespace: linapro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linapro-nacos
  template:
    metadata:
      labels:
        app: linapro-nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: standalone
            - name: PREFER_HOST_MODE
              value: hostname
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
            - name: JVM_XMN
              value: 128m
          ports:
            - name: http
              containerPort: 8848
            - name: grpc-client
              containerPort: 9848
            - name: grpc-server
              containerPort: 9849
            - name: raft
              containerPort: 7848
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
          readinessProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linapro-nacos-data
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-nacos
  namespace: linapro
spec:
  type: ClusterIP
  selector:
    app: linapro-nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc-client
      port: 9848
      targetPort: 9848
    - name: grpc-server
      port: 9849
      targetPort: 9849
    - name: raft
      port: 7848
      targetPort: 7848
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-nacos-external
  namespace: linapro
spec:
  type: NodePort
  selector:
    app: linapro-nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30088
---
apiVersion: batch/v1
kind: Job
metadata:
  name: linapro-db-init
  namespace: linapro
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: linapro-db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-pgsql
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGSQL_HOST" -p "$PGSQL_PORT" -U "$PGSQL_USER" -d "$PGSQL_DATABASE"; do
                echo "waiting for external pgsql"
                sleep 2
              done
          env:
            - name: PGSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_HOST
            - name: PGSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PORT
            - name: PGSQL_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_USER
            - name: PGSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_DATABASE
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PASSWORD
      containers:
        - name: init-database
          image: ghcr.io/wangle201210/linapro:nightly-20260616
          imagePullPolicy: IfNotPresent
          command:
            - ./lina
          args:
            - init
            - --confirm=init
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: linapro-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linapro
  namespace: linapro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: linapro
  template:
    metadata:
      labels:
        app: linapro
    spec:
      initContainers:
        - name: wait-for-pgsql
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGSQL_HOST" -p "$PGSQL_PORT" -U "$PGSQL_USER" -d "$PGSQL_DATABASE"; do
                echo "waiting for external pgsql"
                sleep 2
              done
          env:
            - name: PGSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_HOST
            - name: PGSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PORT
            - name: PGSQL_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_USER
            - name: PGSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_DATABASE
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PASSWORD
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h linapro-redis ping | grep -q PONG; do
                echo "waiting for redis"
                sleep 2
              done
        - name: wait-for-nacos
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z linapro-nacos 8848; do
                echo "waiting for nacos"
                sleep 2
              done
        - name: wait-for-database-init
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until psql -h "$PGSQL_HOST" -p "$PGSQL_PORT" -U "$PGSQL_USER" -d "$PGSQL_DATABASE" -Atqc "SELECT bool_and(to_regclass(table_name) IS NOT NULL) FROM (VALUES ('public.sys_plugin'), ('public.sys_kv_cache'), ('public.sys_cache_revision')) AS required(table_name)" | grep -q t; do
                echo "waiting for database initialization"
                sleep 2
              done
          env:
            - name: PGSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_HOST
            - name: PGSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PORT
            - name: PGSQL_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_USER
            - name: PGSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_DATABASE
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-external-pgsql-secret
                  key: PGSQL_PASSWORD
      containers:
        - name: linapro
          image: ghcr.io/wangle201210/linapro:nightly-20260616
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9120
            - name: collection
              containerPort: 1911
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: plugin-configs
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config
          secret:
            secretName: linapro-config
        - name: plugin-configs
          secret:
            secretName: linapro-source-plugin-configs
            items:
              - key: media-config.yaml
                path: plugins/media/config.yaml
        - name: data
          persistentVolumeClaim:
            claimName: linapro-data
---
apiVersion: v1
kind: Service
metadata:
  name: linapro
  namespace: linapro
spec:
  type: ClusterIP
  selector:
    app: linapro
  ports:
    - name: http
      port: 9120
      targetPort: 9120
    - name: collection
      port: 1911
      targetPort: 1911
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-collection-external
  namespace: linapro
spec:
  type: NodePort
  selector:
    app: linapro
  ports:
    - name: collection
      port: 1911
      targetPort: 1911
      nodePort: 30091
