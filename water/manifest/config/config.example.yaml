# water 源码插件运行时配置模板。
mediaStrategy:
  # 远程 LinaPro media 集群基础地址，解析器会调用
  # <baseUrl>/api/v1/strategies/resolve。
  baseUrl: "http://media-linapro.example.com"
  # 通过 X-Inner-Api-Key 发送的内部 API key，media 插件默认值为 "media"。
  apiKey: "media"
  # 单次远程策略查询超时时间。
  timeout: 10s

water:
  # 每个 LinaPro 进程内的异步水印任务消费者数量。
  consumerCount: 1
