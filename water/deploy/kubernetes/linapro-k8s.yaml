apiVersion: v1
kind: Namespace
metadata:
  name: linapro-water
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-water-postgres-secret
  namespace: linapro-water
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: linapro-change-me
  POSTGRES_DB: linapro
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-water-config
  namespace: linapro-water
type: Opaque
stringData:
  config.yaml: |
    server:
      address: ":9120"
      dumpRouterMap: false
      routeOverWrite: true

    logger:
      path: "stdout"
      stdout: true
      level: "info"

    database:
      default:
        link: "pgsql:postgres:linapro-change-me@tcp(linapro-water-postgres:5432)/linapro?sslmode=disable"
        debug: false
        dryRun: false

    jwt:
      secret: "linapro-jwt-change-me"
      expire: 24h

    cluster:
      enabled: true
      coordination: redis
      election:
        lease: 30s
        renewInterval: 10s
      redis:
        address: "linapro-water-redis:6379"
        db: 0
        password: ""
        connectTimeout: 3s
        readTimeout: 2s
        writeTimeout: 2s

    upload:
      path: "/app/data/upload"

    plugin:
      autoEnable:
        - id: "water"
          withMockData: false
      dynamic:
        storagePath: "/app/data/wasm"

    workspace:
      basePath: "/admin"

    water:
      consumerCount: 2
---
apiVersion: v1
kind: Secret
metadata:
  name: linapro-water-plugin-config
  namespace: linapro-water
type: Opaque
stringData:
  config.yaml: |
    mediaStrategy:
      baseUrl: "http://media-linapro.example.com"
      apiKey: "media"
      timeout: 10s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linapro-water-data
  namespace: linapro-water
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linapro-water-postgres-data
  namespace: linapro-water
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: linapro-water-postgres
  namespace: linapro-water
spec:
  serviceName: linapro-water-postgres
  replicas: 1
  selector:
    matchLabels:
      app: linapro-water-postgres
  template:
    metadata:
      labels:
        app: linapro-water-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: linapro-water-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-water-postgres
  namespace: linapro-water
spec:
  type: ClusterIP
  selector:
    app: linapro-water-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-water-redis
  namespace: linapro-water
spec:
  type: ClusterIP
  selector:
    app: linapro-water-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linapro-water-redis
  namespace: linapro-water
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linapro-water-redis
  template:
    metadata:
      labels:
        app: linapro-water-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: linapro-water-init-database
  namespace: linapro-water
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h linapro-water-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres"
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: init-database
          image: ghcr.io/wangle201210/linapro-water:nightly-20260616
          imagePullPolicy: IfNotPresent
          command:
            - ./lina
          args:
            - init
            - --confirm=init
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: water-plugin-config
              mountPath: /app/config/plugins/water
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: linapro-water-config
        - name: water-plugin-config
          secret:
            secretName: linapro-water-plugin-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linapro-water
  namespace: linapro-water
spec:
  replicas: 10
  selector:
    matchLabels:
      app: linapro-water
  template:
    metadata:
      labels:
        app: linapro-water
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h linapro-water-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres"
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_PASSWORD
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h linapro-water-redis -p 6379 ping | grep -q PONG; do
                echo "waiting for redis"
                sleep 2
              done
        - name: wait-for-database-init
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until [ "$(psql -h linapro-water-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from pg_indexes where schemaname = 'public' and tablename = 'sys_cache_revision' and indexname = 'idx_sys_cache_revision_domain_updated_at';")" = "1" ]; do
                echo "waiting for database initialization"
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: linapro-water-postgres-secret
                  key: POSTGRES_PASSWORD
        - name: verify-watermark-runtime
          image: ghcr.io/wangle201210/linapro-water:nightly-20260616
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if grep -a -q "watermark cgo/FFmpeg library is unavailable because CGO is disabled" /app/lina; then
                echo "water image was built with CGO disabled; build apps/lina-plugins/water/deploy/docker/Dockerfile and use that image"
                exit 1
              fi
              ldd_output="$(ldd /app/lina 2>&1 || true)"
              if echo "$ldd_output" | grep -Eq "not found|No such file|Error loading shared library"; then
                echo "$ldd_output"
                echo "water image is missing FFmpeg/x264 runtime libraries"
                exit 1
              fi
              if ! echo "$ldd_output" | grep -Eq "libav(format|codec|util|filter)|libswscale|libx264"; then
                echo "$ldd_output"
                echo "water image is not linked with FFmpeg/x264 runtime libraries"
                exit 1
              fi
      containers:
        - name: linapro
          image: ghcr.io/wangle201210/linapro-water:nightly-20260616
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9120
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: water-plugin-config
              mountPath: /app/config/plugins/water
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9120
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config
          secret:
            secretName: linapro-water-config
        - name: water-plugin-config
          secret:
            secretName: linapro-water-plugin-config
        - name: data
          persistentVolumeClaim:
            claimName: linapro-water-data
---
apiVersion: v1
kind: Service
metadata:
  name: linapro-water
  namespace: linapro-water
spec:
  type: NodePort
  selector:
    app: linapro-water
  ports:
    - name: http
      port: 9120
      targetPort: 9120
      nodePort: 30081
